<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="heading">Player-1</h1>

        <h3 class="anotherheading"> Chances : <span></span> </h3>

        <input class="playeroneinput" type="text" placeholder="Enter Number">

        <button class="playeronebutton">
            Submit
        </button>

        <input class="playertwoinput" type="text" placeholder="Guess Number">

        <button class="playertwobutton">
            Guess
        </button>

        <p class="error"></p>

        <img src="./images/congratulations.gif" alt="Winner">
        
        <button class="reset">Reset Game</button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
